services:
  zwave-js-ui:
    image: zwavejs/zwave-js-ui:latest
    container_name: zwave-js-ui
    restart: unless-stopped

    tty: true
    stop_signal: SIGINT

    environment:
      - TZ=Europe/Berlin

    devices:
      - /dev/serial/by-id/usb-0658_0200-if00:/dev/ttyACM0

    volumes:
      - ./store:/usr/src/app/store

    ports:
      - "8091:8091"
